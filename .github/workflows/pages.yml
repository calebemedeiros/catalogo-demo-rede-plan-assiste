name: Coletar, validar e publicar catálogo

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      allow_breaking_data_update:
        description: "Liberar variação de dados já revisada"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: catalog-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_BREAKING_DATA_UPDATE: ${{ inputs.allow_breaking_data_update && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_production.py
      - run: python scripts/validate_production.py
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-rede-plan-assiste-${{ github.run_number }}
          path: |
            api/v2
            release
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
